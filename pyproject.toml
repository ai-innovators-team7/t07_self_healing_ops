[project]
name = "ai-innovators-expedition-starter"
version = "0.1.0"
description = "Common ADK Starter Repository for the AI Innovators Expedition Hackathon (Google London, 29-30 Oct 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[a2a,eval]==2.11.0",
    "google-cloud-aiplatform[agent_engines,adk]==1.165.1",
    "google-genai==2.31.0",
    "google-cloud-bigquery==3.46.2",
    "google-cloud-storage==3.17.1",
    "cloudpickle==3.1.2",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "mcp==1.30.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
